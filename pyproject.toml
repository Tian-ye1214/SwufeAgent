[project]
name = "RedLotus"
version = "1.0.0"
description = "红莲极意"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.60",
    "ddgs>=9.14.1",
    "filelock>=3.29.0",
    "httpx[http2]>=0.28.1",
    "json-repair>=0.59.5",
    "lancedb>=0.30.2",
    "loguru>=0.7.0",
    "matplotlib>=3.10.9",
    "ncatbot>=4.4.1.post1",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "playwright>=1.49.0",
    "prompt-toolkit>=3.0.0",
    "pydantic-ai==1.80.0",
    "pydantic-ai-slim[anthropic]==1.80.0",
    "pyinstaller>=6.20.0",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "reportlab>=4.5.0",
    "requests>=2.33.1",
    "rich>=15.0.0",
    "textual>=8.2.7",
    "tiktoken==0.12.0",
    "tushare>=1.4.29",
    "wechatbot-sdk>=0.2.1",
